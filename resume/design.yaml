# Shared RenderCV theme for every resume variant.
# Jake's-resume layout (the US tech standard): company/location on row 1, role/dates on row 2.
# One column, no graphics, real text — ATS-safe. Must stay one page.
design:
  theme: sb2nov
  page:
    size: us-letter
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.6in
    right_margin: 0.6in
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(20, 20, 20)
    name: rgb(0, 0, 0)
    headline: rgb(60, 60, 60)
    connections: rgb(40, 40, 40)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
  typography:
    line_spacing: 0.66em
    alignment: left
    font_family:
      body: XCharter
      name: XCharter
      headline: XCharter
      connections: XCharter
      section_titles: XCharter
    font_size:
      body: 11pt
      name: 26pt
      headline: 11pt
      connections: 10.5pt
      section_titles: 1.15em
    small_caps:
      section_titles: true
    bold:
      name: true
      section_titles: true
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: center
    space_below_name: 0.4cm
    space_below_headline: 0.25cm
    space_below_connections: 0.35cm
    connections:
      phone_number_format: international
      hyperlink: true
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: "|"
      space_between_connections: 0.3cm
  section_titles:
    type: with_full_line
    line_thickness: 0.6pt
    space_above: 0.55cm
    space_below: 0.28cm
  sections:
    allow_page_break: false
    space_between_regular_entries: 0.45cm
    space_between_text_based_entries: 0.12cm
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.2cm
    side_space: 0.1cm
    short_second_row: false
    highlights:
      bullet: "•"
      nested_bullet: "◦"
      space_left: 0.1cm
      space_above: 0.1cm
      space_between_items: 0.07cm
      space_between_bullet_and_text: 0.45em
  templates:
    experience_entry:
      main_column: "**COMPANY**\n*POSITION*\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "LOCATION\n*DATE*"
    education_entry:
      main_column: "**INSTITUTION**\n*DEGREE* *in* *AREA*\nSUMMARY\nHIGHLIGHTS"
      degree_column: null
      date_and_location_column: "LOCATION\n*DATE*"
    normal_entry:
      main_column: "**NAME**\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "LOCATION\n*DATE*"
    one_line_entry:
      main_column: "**LABEL:** DETAILS"
